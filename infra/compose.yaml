name: aijob-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aijob
      POSTGRES_USER: aijob
      POSTGRES_PASSWORD: aijob
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aijob -d aijob"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - aijob_postgres_data:/var/lib/postgresql/data

volumes:
  aijob_postgres_data:
