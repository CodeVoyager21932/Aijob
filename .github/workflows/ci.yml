name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIJOB_TEST_DATABASE_URL: postgresql://aijob:aijob@127.0.0.1:5432/aijob_test
      APP_ENV: test
      DATABASE_URL: postgresql://aijob:aijob@127.0.0.1:5432/aijob_test
      ENABLE_AI: "false"
      ENABLE_INTERNAL_PREVIEW: "false"
      ENABLE_LOCAL_MVP: "false"
      ENABLE_SOURCE_PROBE: "false"
      RESUME_ENCRYPTION_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aijob_test
          POSTGRES_PASSWORD: aijob
          POSTGRES_USER: aijob
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aijob -d aijob_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit applicable dependencies
        run: pnpm audit:ci

      - name: Prepare integration test database
        run: |
          test -n "$AIJOB_TEST_DATABASE_URL"
          pnpm db:migrate

      - name: Lint, type-check, and test
        run: pnpm check

      - name: Build
        run: pnpm build
